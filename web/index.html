<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finance Quest</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <header>
        <h1>Finance Quest</h1>
        <p>Seu dinheiro. Sua jornada.</p>
    </header>

    <main class="card">

        <h2>Novo lançamento</h2>

        <form id="form-lancamento">

            <div class="linha">

                <div class="campo campo-tipo">

                    <label for="tipo">
                        Tipo
                    </label>

                    <select
                        id="tipo"
                        name="tipo"
                    >
                        <option value="saida">
                            Saída
                        </option>

                        <option value="entrada">
                            Entrada
                        </option>
                    </select>

                </div>

                <div class="campo campo-valor">

                    <label for="valor">
                        Valor
                    </label>

                    <input
                        type="number"
                        id="valor"
                        name="valor"
                        step="0.01"
                    >

                </div>

            </div>

            <div class="campo">

                <label for="data">
                    Data
                </label>

                <input
                    type="date"
                    id="data"
                    name="data"
                >

            </div>

            <div
                class="campo"
                id="campo-categoria"
            >

                <label for="categoria">
                    Categoria
                </label>

                <select
                    id="categoria"
                    name="categoria"
                >
                    <option value="">
                        Selecione...
                    </option>

                    <option value="supermercado">
                        Supermercado
                    </option>

                    <option value="moradia">
                        Moradia
                    </option>

                    <option value="transporte">
                        Transporte
                    </option>

                    <option value="lazer">
                        Lazer
                    </option>

                    <option value="compras">
                        Compras
                    </option>

                    <option value="contas">
                        Contas
                    </option>

                    <option value="aportes">
                        Metas/Reservas
                    </option>

                    <option value="olivia">
                        Olívia
                    </option>

                    <option value="mae">
                        Mãe
                    </option>

                    <option value="outros">
                        Outros
                    </option>
                </select>

            </div>

            <div
                class="campo"
                id="campo-item"
            >

                <label for="item">
                    Item
                </label>

                <select
                    id="item"
                    name="item"
                >
                    <option value="">
                        Selecione...
                    </option>
                </select>

            </div>

            <div 
                class="campo"
                id="campo-pagamento"
            >
                <label for="pagamento">
                    Meio de Pagamento
                </label>

                <select
                    id="pagamento"
                    name="pagamento"
                >
                    <option value="">
                        Selecione...
                    </option>

                    <option value="pix">
                        Pix
                    </option>

                    <option value="cartao-credito">
                        Cartão de Crédito
                    </option>

                    <option value="cartao-debito">
                        Cartão de Débito
                    </option>

                    <option value="transferencia">
                        Transferência
                    </option>
                </select>

            </div>

            <div class="campo">

                <label for="observacao">
                    Observação
                </label>

                <input
                    type="text"
                    id="observacao"
                    name="observacao"
                    placeholder="Opcional"
                >

            </div>

            <button
                type="submit"
                class="botao-principal"
            >
                Salvar lançamento
            </button>

        </form>

    </main>

    <script src="script.js"></script>

</body>

</html>
